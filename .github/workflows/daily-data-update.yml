name: Atualização diária de jogos/odds

on:
  schedule:
    # 07:00 UTC ~ 08:00 em Portugal (WET). Não segue DST — pode desviar 1h no horário de verão (WEST).
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar public/data.json (ESPN + The-Odds-API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/update-daily-data.mjs

      - name: Commit e push (só se algo mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data.json; then
            echo "Sem alterações a public/data.json — nada para publicar."
          else
            git add public/data.json
            git commit -m "Atualização automática de jogos/odds ($(date -u +%Y-%m-%d))"
            git push
          fi
